name: Windows 构建与测试

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["windows/**", "codexBar/Resources/**", "scripts/test_desktop_*.cjs", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", "codexBar/Resources/**", "scripts/test_desktop_*.cjs", ".github/workflows/windows.yml"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: windows/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - name: 共享路由脚本回归
        working-directory: .
        run: node scripts/test_desktop_thread_route.cjs
      - run: pnpm build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: 准备 Windows 换肤端到端环境
        shell: pwsh
        run: ./tests/prepare-skin-e2e.ps1
      - name: Windows 换肤与进程隔离测试
        run: cargo test --manifest-path src-tauri/Cargo.toml windows_skin_end_to_end -- --ignored --nocapture
      - name: 安装官方 Codex Windows 验证客户端
        shell: pwsh
        run: ./tests/prepare-official-skin-e2e.ps1
      - name: 官方 Windows Codex 启动与换肤测试
        run: cargo test --manifest-path src-tauri/Cargo.toml official_windows_skin_startup -- --ignored --nocapture
      - name: 保存换肤截图与测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-skin-e2e-${{ github.sha }}
          path: ${{ runner.temp }}/codex-box-skin-results
          if-no-files-found: warn
      - name: 构建 EXE 和 MSI
        run: pnpm tauri build --bundles nsis,msi
      - name: Windows 启动冒烟测试
        shell: pwsh
        run: |
          $exe = Resolve-Path "src-tauri/target/release/codex-box-windows.exe"
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            throw "codex-box Windows 进程提前退出，退出码：$($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force
          $process.WaitForExit()
      - name: 上传 Windows 安装包
        uses: actions/upload-artifact@v4
        with:
          name: codex-box-windows-${{ github.sha }}
          path: |
            windows/src-tauri/target/release/bundle/nsis/*.exe
            windows/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
