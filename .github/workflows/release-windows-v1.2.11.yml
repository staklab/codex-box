name: 发布 Windows v1.2.11

on:
  push:
    branches: [main]
    paths: [".github/workflows/release-windows-v1.2.11.yml"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.2.11
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: windows/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: 构建 EXE 和 MSI
        run: pnpm tauri build --bundles nsis,msi
      - name: Windows 启动冒烟测试
        shell: pwsh
        run: |
          $exe = Resolve-Path "src-tauri/target/release/codex-box-windows.exe"
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            throw "codex-box Windows 进程提前退出，退出码：$($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force
          $process.WaitForExit()
      - name: 创建 GitHub Release 并上传安装包
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe"
            Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi"
          ) | ForEach-Object { $_.FullName }
          if ($assets.Count -lt 2) {
            throw "未找到完整的 Windows 安装包"
          }
          gh release create v1.2.11 @assets `
            --repo "${{ github.repository }}" `
            --title "codex-box Windows v1.2.11" `
            --notes-file "../docs/RELEASE_NOTES_WINDOWS_1.2.11.md" `
            --verify-tag `
            --latest
