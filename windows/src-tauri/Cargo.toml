[package]
name = "codex-box-windows"
version = "1.2.10"
description = "codex-box Windows 系统托盘伴侣"
authors = ["codex-box contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "codex_box_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process"] }
rand = "0.9"
sha2 = "0.10"
base64 = "0.22"
url = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
walkdir = "2"
axum = "0.8"
futures-util = "0.3"
semver = "1"
zip = { version = "4", default-features = false, features = ["deflate"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
csv = "1"

[dev-dependencies]
tempfile = "3"
httpmock = "0.7"
